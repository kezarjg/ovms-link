<script>
(function(){
  loadcmd("script eval abrp.webStatus()").then(function(out){
    try {
      var s = JSON.parse(out);
      var msg = s.token_set
        ? (s.sending ? ('ABRP: connected · ' + s.queue_depth + ' queued') : 'ABRP: idle')
        : 'ABRP: not configured';
      $('#abrp-hookline').remove();
      $('.panel-body').first().prepend('<p id="abrp-hookline"><strong>' + msg + '</strong></p>');
    } catch(e){}
  });
})();
</script>
