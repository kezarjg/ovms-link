<div class="panel panel-primary">
  <div class="panel-heading">ABRP Status</div>
  <div class="panel-body">
    <table class="table table-condensed">
      <tbody id="abrp-status-body"><tr><td>Loading…</td></tr></tbody>
    </table>
  </div>
</div>
<script>
(function(){
  function row(k, v){ return '<tr><th style="width:40%">' + k + '</th><td>' + v + '</td></tr>'; }
  function render(s){
    var id = s.identity || {};
    var conn = s.token_set
      ? (id.state === 'ok' ? ('Connected as ' + id.name + ' — ' + id.vehicle)
        : (id.state === 'error' ? ('token error: ' + (id.error || '')) : 'token set'))
      : 'not configured';
    var ls = s.last_send;
    var lsTxt = ls ? ((ls.ok ? 'ok' : 'FAIL') + ' (' + (ls.code || ls.error || '') + ', ' + ls.count + ' pts, ' + ls.ts + ')') : '—';
    var t = s.telemetry || {};
    var html = '';
    html += row('Plugin', s.version);
    html += row('Connection', conn);
    html += row('GPS time valid', s.time_valid ? 'yes' : 'no');
    html += row('Sending', s.sending ? 'yes' : 'no');
    html += row('Queue depth', s.queue_depth);
    html += row('Last send', lsTxt);
    if ('soc' in t) html += row('SoC', t.soc + ' %');
    if ('power' in t) html += row('Power', t.power + ' kW');
    if ('speed' in t) html += row('Speed', t.speed);
    if ('is_charging' in t) html += row('Charging', t.is_charging ? 'yes' : 'no');
    $('#abrp-status-body').html(html);
  }
  function refresh(){
    loadcmd("script eval abrp.webStatus()").then(function(out){
      try { render(JSON.parse(out)); }
      catch(e){ $('#abrp-status-body').html('<tr><td>unavailable</td></tr>'); }
    });
  }
  var timer = window.setInterval(refresh, 5000);
  refresh();
  // Best-effort timer cleanup when the page is replaced (verify the exact hook on-device).
  $('#main').one('remove', function(){ window.clearInterval(timer); });
})();
</script>
